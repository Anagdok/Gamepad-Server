<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wirtualny Pad cyfrowy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lobby">
        <h1>Wpisz swój Nick</h1>
        <input type="text" id="nick" placeholder="Np. Gracz1" maxlength="12">
        <button id="btn-graj">Dołącz do gry!</button>
    </div>

    <div id="kontroler" style="display: none;">
        <div id="dpad-zone">
            <button id="dpad-up" class="dpad-btn">▲</button>
            <button id="dpad-left" class="dpad-btn">◀</button>
            <div class="dpad-center"></div>
            <button id="dpad-right" class="dpad-btn">▶</button>
            <button id="dpad-down" class="dpad-btn">▼</button>
        </div>

        <div id="menu-zone">
            <button id="btn-select" class="menu-btn">SELECT</button>
            <button id="btn-start" class="menu-btn">START</button>
        </div>

        <div id="action-zone">
            <button id="btn-b" class="action-btn">B</button>
            <button id="btn-a" class="action-btn">A</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
